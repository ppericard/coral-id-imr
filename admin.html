<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Photo curation</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="app.css?v=31">
<link rel="stylesheet" href="admin.css?v=44">
</head>
<body class="admin">
<script>try{var t=localStorage.getItem("imr-coral-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<div class="wrap">
  <header>
    <h1 class="brand"><a class="home" href="./"><img src="icon.svg" alt="" width="30" height="30"></a></h1>
    <nav class="adm-modes" id="modes" aria-label="Entry point" hidden><a data-mode="genus" href="#">Genera</a><a data-mode="cand" href="#~cand">Candidates</a><a data-mode="form" href="#~form">Forms</a><a data-mode="quality" href="#~quality">Quality</a><a data-mode="triage" href="#~triage">Triage</a><a data-mode="diff" href="#~diff">Difficulty</a><a data-mode="mont" href="#~mont">Montages</a><a data-mode="excluded" href="#~excluded">Excluded</a></nav>
    <select class="adm-modesel" id="modesel" aria-label="Entry point" hidden></select>
    <div class="hdr-tools" id="tools" hidden>
      <button type="button" class="chip adm-ico" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>↶</button>
      <button type="button" class="chip adm-ico" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>↷</button>
      <div id="size" role="group" aria-label="Photo size"><button type="button" data-size="s" title="Small photos">S</button><button type="button" data-size="m" title="Medium photos">M</button><button type="button" data-size="l" title="Large photos">L</button></div>
      <button type="button" class="chip adm-save" id="save" disabled>Publish</button>
      <button type="button" class="chip adm-ico" id="help" title="Help" aria-label="Help">?</button>
      <details class="adm-more"><summary class="chip adm-ico" title="More" aria-label="More">⋯</summary><div class="adm-menu">
        <button type="button" class="adm-phone" id="redo2">Redo</button>
        <button type="button" class="adm-phone" id="help2">Help</button>
        <a id="preview" href="./?draft" target="_blank" rel="noopener">Preview draft</a>
        <button type="button" id="booksw" aria-pressed="true">CF book: on</button>
        <button type="button" id="download">Download JSON</button>
        <button type="button" id="signout" hidden>Sign out</button>
      </div></details>
    </div>
  </header>
  <main id="view"><p class="note">Loading…</p></main>
</div>
<div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo"></div>
<script src="admin.js?v=59"></script>
</body>
</html>
