<!doctype html>
<!-- Fish sheets mockup for Pierre's Q2 of the fish-sheets study (docs/reviews/2026-11-05-fish-sheets-study.md §9):
     is a genus a block on its family sheet (option A) or a short page of its own (option B)? Two families from fish.json:
     Damselfishes (several genera with many species) and Moorish Idol (one genus, one species). Static, not part of the
     app: it borrows app.css for the tokens, fonts and a few components, and loads nothing else. Real data: the IMR lines,
     names, species, commonness order and photos (curated, picked by Pierre's Q3 rule: reference and easy photos first,
     whoever took them). Hatched boxes are placeholder text. Open proto/fish-sheets.html; ?theme=dark for the dark theme. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Fish sheets mockup</title>
    <link rel="stylesheet" href="../app.css" />
    <style>
      .mk-wrap {
        max-width: 760px;
        margin: 0 auto;
        padding-bottom: 48px;
      }
      /* The mockup's own chrome (not app design): dashed, muted. */
      .mk {
        margin: 10px 0 4px;
        padding: 8px 10px;
        border: 1px dashed var(--muted);
        border-radius: var(--r);
        font-size: var(--fs-s);
        color: var(--muted);
      }
      .mk b {
        color: var(--ink);
      }
      .mk p {
        margin: 0 0 6px;
      }
      .mk .seg {
        margin: 2px 6px 4px 0;
      }
      .mk .seg button[aria-pressed='true'] {
        color: var(--ink);
      }
      .mk-opt {
        margin: 10px 0 0;
        font-size: var(--fs-xs);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      /* Placeholder text: hatched, with its tag. */
      .ph {
        position: relative;
        padding: 6px 10px 6px;
        border: 1px dashed var(--warn);
        border-radius: var(--r-sm);
        background: repeating-linear-gradient(
          135deg,
          color-mix(in srgb, var(--warn) 10%, transparent) 0 6px,
          transparent 6px 12px
        );
        color: var(--muted);
        font-size: var(--fs-s);
      }
      .ph::before {
        content: 'Placeholder';
        display: block;
        font-size: var(--fs-xs);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--warn);
      }
      .ph ul {
        margin: 2px 0 0;
        padding-left: 18px;
      }
      .ph.sim::before {
        content: 'Simulated player';
      }
      p.ph,
      div.ph {
        margin: 8px 0;
      }
      .names {
        margin: 10px 0 0;
      }
      .names .sci {
        font-family: var(--display);
        font-weight: 700;
        font-size: var(--fs-2xl);
        line-height: 1;
        margin: 0;
      }
      .names .com {
        margin: 4px 0 0;
        font-size: var(--fs-m);
        font-weight: 600;
      }
      .names .grp {
        margin: 2px 0 0;
        font-size: var(--fs-s);
        color: var(--muted);
      }
      .sheet h3 small {
        font-family: var(--body);
        font-weight: 600;
        font-size: var(--fs-s);
        color: var(--muted);
        margin-left: 6px;
      }
      .tipbox ul {
        margin: 0;
        padding-left: 20px;
      }
      .tipbox .pg,
      .sheet h3 .pg {
        float: right;
        font-family: var(--body);
        font-size: var(--fs-xs);
        font-weight: 600;
        color: var(--muted);
      }
      .filt {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 6px 0 10px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        border-radius: var(--pill);
        padding: 0 14px;
        font: inherit;
        font-size: var(--fs-s);
        gap: 6px;
      }
      .chip[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      /* Species tiles: scientific name first (Q10), then the common name. */
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
        margin: 8px 0 4px;
      }
      .tile {
        margin: 0;
        min-width: 0;
        background: var(--surface);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .tile .ph-img,
      .tile img {
        display: block;
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        background: var(--surface-2);
      }
      .tile figcaption {
        padding: 6px 8px 8px;
        font-size: var(--fs-s);
        line-height: 1.25;
      }
      .tile figcaption i {
        display: block;
        font-weight: 600;
      }
      .tile figcaption span {
        display: block;
        color: var(--muted);
      }
      .tile figcaption small {
        display: block;
        color: var(--muted);
        margin-top: 2px;
      }
      .star {
        color: var(--accent);
        font-weight: 700;
      }
      /* The one "No photo yet" drawing (Q9). */
      .nofish {
        display: grid;
        place-items: center;
        aspect-ratio: 4/3;
        background: var(--surface-2);
        color: var(--muted);
        text-align: center;
        font-size: var(--fs-xs);
      }
      .nofish svg {
        width: 46%;
        height: auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nofish .np-t {
        fill: color-mix(in srgb, var(--accent) 22%, transparent);
      }
      .nofish .eye {
        fill: currentColor;
        stroke: none;
      }
      /* Option A: one block per genus on the family sheet. */
      .gblock {
        margin: 14px 0;
        padding: 10px 12px 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r);
      }
      .gblock > h3 {
        margin: 0 0 6px;
        font-family: var(--display);
        font-size: var(--fs-xl);
        color: var(--ink);
        text-transform: none;
        letter-spacing: 0;
      }
      .gblock > h3 small {
        text-transform: none;
        letter-spacing: 0;
      }
      .gblock .tipbox {
        padding: 6px 12px 8px;
        border-left-width: 4px;
        font-size: var(--fs-s);
      }
      .gblock .tipbox .lab,
      .gpage .lab {
        display: block;
        font-weight: 700;
        color: var(--accent);
        font-size: var(--fs-xs);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .gblock .more {
        margin: 6px 0 0;
        font-size: var(--fs-s);
      }
      .gone {
        display: flex;
        gap: 10px;
        align-items: center;
        margin: 8px 0;
        padding: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r);
        color: inherit;
        text-decoration: none;
      }
      .gone img,
      .gone .nofish {
        width: 96px;
        flex: none;
        aspect-ratio: 4/3;
        object-fit: cover;
        border-radius: var(--r-sm);
      }
      .gone .txt {
        flex: 1;
        min-width: 0;
        font-size: var(--fs-s);
        line-height: 1.3;
      }
      .gone .txt i {
        font-weight: 600;
      }
      .gone .txt span,
      .gone .txt small {
        display: block;
        color: var(--muted);
      }
      .gone .go {
        color: var(--accent);
        font-size: var(--fs-l);
      }
      .ghead {
        font-size: var(--fs-xs);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 14px 0 0;
      }
      /* Option B: one row per genus, a tap opens its short page. */
      .grow .stack {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px;
        width: 96px;
        flex: none;
      }
      .grow .stack img,
      .grow .stack .nofish {
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        border-radius: var(--r-xs);
      }
      .grow .stack img:first-child:nth-last-child(1) {
        grid-column: 1 / 3;
      }
      .lookc {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .credits {
        margin-top: 18px;
        font-size: var(--fs-xs);
        color: var(--muted);
      }
      .credits ol {
        padding-left: 20px;
      }
      .credits a {
        color: var(--muted);
      }
      .repline {
        margin: 18px 0 0;
        font-size: var(--fs-s);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>

          ${myprog('one more species, if Scientific names is on')}
          ${imr ? tipbox(imr[1].cues, imr[1].sl) : ''}
          ${F.genera.length > 1 ? `<p class="ph">What sets <i>${esc(g)}</i> apart from its sibling genera (agent draft, Pierre validates).</p>` : ''}
          ${wormsNote(x.species)}
          <h3>Species <small>${x.species.length}</small></h3>${x.species.length > 1 ? filt(x.species, 'species') : ''}${tiles(x.species, true)}`;
        if (x.species.length === 1)
          h = h.replace('<h3>Species', '<p class="mk">Mockup note: the only genus of its family, with one species, so this page repeats the family and species sheets. The study recommends no genus page here.</p><h3>Species');
        if (sib.length)
          h += `<h3>Don't confuse with</h3>${sib
            .map(y => oneRow({...y.species[0], name: y.g, common: imrOf(F, y.g)[1].cues.join(' · ')}, `${y.species.length} species · IMR sub-entry lines`, `#${key}-g-${y.g}`))
            .join('')}`;
        return h + `<p class="repline"><button type="button" class="linkish">⚑ Report a problem with this sheet</button></p></article>`;
      }

      function chrome(view, key) {
        const fam = [
            ['damsel', 'Damselfishes'],
            ['idol', 'Moorish Idol']
          ],
          opt = view.includes('-g-') ? 'b' : view.split('-')[1];
        return `<p><b>Mockup, not the app</b> · fish sheets, Q2: a genus as a <b>block</b> on its family sheet (A) or a short <b>page</b> of its own (B).
          Real data from fish.json; photos by the Q3 rule; hatched boxes are placeholders.</p>
          <div class="seg" role="group" aria-label="Family">${fam.map(([k, t]) => `<button type="button" data-go="${k}-${opt}" aria-pressed="${key === k}">${t}</button>`).join('')}</div>
          <div class="seg" role="group" aria-label="Option">${[
            ['a', 'A · genus blocks'],
            ['b', 'B · genus pages']
          ]
            .map(([o, t]) => `<button type="button" data-go="${key}-${o}" aria-pressed="${opt === o}">${t}</button>`)
            .join('')}</div>
          <p class="mk-opt">${
            view.includes('-g-')
              ? 'Option B · the genus page (opened from a genus row)'
              : opt === 'a'
                ? 'Option A · every genus is a block on the family sheet, its species inside'
                : 'Option B · the family sheet lists its genera; a tap opens the genus page'
          }</p>`;
      }
      function draw() {
        const view = (location.hash.slice(1) || 'damsel-a').replace(/[^\w-]/g, ''),
          key = view.split('-')[0] in D ? view.split('-')[0] : 'damsel',
          g = view.split('-g-')[1];
        credits.length = 0;
        const body = g && D[key].genera.some(x => x.g === g) ? genusB(key, g) : view.endsWith('-b') ? famB(key) : famA(key);
        document.getElementById('mk').innerHTML = chrome(view, key);
        document.getElementById('v').innerHTML =
          body +
          `<details class="credits"><summary>Photos on this page (${credits.length}): reference and easy photos first, whoever took them (Q3)</summary><ol>${credits
            .map(p => `<li>${esc(p.a.replace(/^\(c\)\s*/i, ''))} · <a href="${esc(p.o)}" target="_blank" rel="noopener">iNaturalist</a>${p.rep ? ` · reference photo (${esc(p.rep)})` : ''} · ease ${p.e}</li>`)
            .join('')}</ol></details>`;
        document.querySelectorAll('[data-mine]').forEach(b => (b.onclick = () => ((mine = b.dataset.mine === '1'), draw())));
        document.querySelectorAll('[data-go]').forEach(b => (b.onclick = () => (location.hash = b.dataset.go)));
      }
      addEventListener('hashchange', () => (draw(), scrollTo(0, 0)));
      draw();
    </script>
  </body>
</html>
