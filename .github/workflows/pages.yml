name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN commits do not trigger push workflows. Publish the resulting
  # main even if photo processing failed (curation itself is already committed).
  workflow_run:
    workflows: [Candidate photos]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    # Never deploy a manually selected feature branch or consume its artifacts.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    # Job-level so an off-main dispatch cannot cancel production before its if.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the single Actions publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$build_type" != workflow ]; then
            echo '::error::Set Settings > Pages > Source to GitHub Actions. See docs/PAGES.md.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # A delayed photo run or an old rerun must not roll back the site.
          ref: main
          persist-credentials: false
      # The build below (tools/build_site.py: curplay, stamp_versions, check_versions): Python pinned as in every workflow
      # (approved-photos.yml).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      # The admin's Publish and the Candidate photos bot commit to main without running Checks: a JSON file they broke, or a
      # data.json out of its layout, fails the deploy here, and the last good site stays live (repo hygiene audit, 2026-11-08).
      - name: Check the data files (every tracked JSON parses; the data.json layout)
        run: |
          python3 tools/check_json.py
          python3 tools/datajson.py --check
      - uses: actions/configure-pages@v6
      # git archive leaves out what .gitattributes marks export-ignore (docs/, tests/, tools/, judging/, .github/, .claude/):
      # the site is the app, the admin, the Lab, the data and the photos only (tests/artifact.test.js).
      - name: Stage the static site
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pages"
          echo "Published source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      # The build tools, in a temporary folder (nothing added to the repo, no package.json): terser for tools/minify.js
      # (pinned there too), Playwright for the staged copy's smoke. The Chromium download is kept between runs, as in
      # smokes.yml.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.65.1
      - name: Install terser and Playwright (temporary folder, nothing added to the repo)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm install --no-save --no-audit --no-fund terser@5.51.2 playwright@1.65.1
          npx playwright install chromium
      # The build, on the staged copy only (tools/build_site.py): the players' curation (Pierre, 2026-11-09:
      # curation-play.json, what the app reads of curation.json; curation.json itself served unchanged, for the admin),
      # the version numbers stamped (Pierre, 2026-11-04: PRs never edit a version number), the scripts minified with source
      # maps (architecture review of 2026-11-18, R4: tools/minify.js), stamped again on the minified bytes with the build
      # number, then tools/check_versions.py. A reference to no file, a minifier missing or not the pinned one, or a ?v=
      # lost in minifying fails the deploy, and the last good site stays live.
      - name: Build the site (curation, stamps, minified scripts)
        run: |
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" python3 tools/build_site.py "$RUNNER_TEMP/pages" --build "${{ github.run_number }}" > "$RUNNER_TEMP/build.md"
          cat "$RUNNER_TEMP/build.md" >> "$GITHUB_STEP_SUMMARY"
      # The built copy played before it goes live (tests/staged.smoke.js: each subject's Home and one question, the Lab,
      # the admin demo, the service worker's shell), every other host refused: a minifier bug fails the deploy here.
      - name: Play the built copy before it goes live
        env:
          STAGED_DIR: ${{ runner.temp }}/pages
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/staged.smoke.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Leave time for the action to cancel a timed-out Pages deployment
          # before the outer job timeout. Cancellation also has a signal handler.
          timeout: 600000
