name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN commits do not trigger push workflows. Publish the resulting
  # main even if photo processing failed (curation itself is already committed).
  workflow_run:
    workflows: [Candidate photos]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    # Never deploy a manually selected feature branch or consume its artifacts.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    # Job-level so an off-main dispatch cannot cancel production before its if.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the single Actions publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$build_type" != workflow ]; then
            echo '::error::Set Settings > Pages > Source to GitHub Actions. See docs/PAGES.md.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # A delayed photo run or an old rerun must not roll back the site.
          ref: main
          persist-credentials: false
      # stamp_versions.py and check_versions.py below: Python pinned as in every workflow (approved-photos.yml).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      # The admin's Publish and the Candidate photos bot commit to main without running Checks: a JSON file they broke, or a
      # data.json out of its layout, fails the deploy here, and the last good site stays live (repo hygiene audit, 2026-11-08).
      - name: Check the data files (every tracked JSON parses; the data.json layout)
        run: |
          python3 tools/check_json.py
          python3 tools/datajson.py --check
      - uses: actions/configure-pages@v6
      # git archive leaves out what .gitattributes marks export-ignore (docs/, tests/, tools/, judging/, .github/, .claude/):
      # the site is the app, the admin, the Lab, the data and the photos only (tests/artifact.test.js).
      - name: Stage the static site
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/pages"
          echo "Published source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      # The players' copy of the curation (Pierre, 2026-11-09): curation-play.json, what the app reads of curation.json
      # (tools/curplay.py; curation.json itself served unchanged, for the admin). Before the stamps: sw.js V hashes it.
      - name: Write the players' curation
        run: python3 tools/curplay.py "$RUNNER_TEMP/pages"
      # Every ?v=, LAB_V and the sw.js cache name V from content hashes, the build number in the pages (Pierre,
      # 2026-11-04: PRs never edit a version number). On the staged copy only; a reference to no file fails the deploy.
      - name: Stamp the version numbers
        run: |
          {
            echo '<details><summary>Stamped versions (build ${{ github.run_number }})</summary>'
            echo
            echo '```'
            python3 tools/stamp_versions.py "$RUNNER_TEMP/pages" --build "${{ github.run_number }}"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/check_versions.py --dir "$RUNNER_TEMP/pages"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Leave time for the action to cancel a timed-out Pages deployment
          # before the outer job timeout. Cancellation also has a signal handler.
          timeout: 600000
