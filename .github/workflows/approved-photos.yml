# After each photo-curation publish (curation.json pushed from admin.html): download the candidates Pierre added
# (tools/fetch_approved.py), then refill the candidate lists up to their caps (tools/fetch_local.py), and commit.
name: Candidate photos
on:
  push:
    branches: [main]
    paths: [curation.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: candidate-photos
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      # --games: a game photo of Millepora or a bonus genus still remote (r: 1) is downloaded too (R2 step 2).
      - run: python tools/fetch_approved.py --games
      - run: python tools/fetch_local.py
        working-directory: .
      # Photo shapes for the quiz layout (designer re-review 2026-11-01): new photos get their `ar` too.
      - run: python tools/apply_ratios.py
      # Every photo in its four sizes (1600, 960, 480, 240 px): fills any smaller file missing.
      - run: python tools/photos.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json cand.json img
          git diff --cached --quiet && exit 0
          git commit -m "Candidate photos: download added ones, refill the lists"
          git pull --rebase origin main
          git push origin HEAD:main
  # The photos to R2, in their own job under the same concurrency group as photos-r2.yml, so the two writers of the
  # bucket never run at once (Codex review #380), from today's main (the commit above, if any, is on it; a rerun with
  # nothing to commit mirrors main too). Its push starts no other workflow (GITHUB_TOKEN), hence this job.
  r2:
    needs: photos
    runs-on: ubuntu-latest
    concurrency:
      group: photos-r2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: tools/r2_sync.sh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
