# The Corals of the World originals of the IMR lecture photos, to Cloudflare R2 (ROADMAP "IMR lecture photos never
# upscaled; the Corals of the World captures replaced by their originals", Pierre, 2026-11-18, "C12 A+D"):
# tools/fetch_imr_originals.py downloads each original once from coralsoftheworld.org (one request every 2 s), cuts and turns
# it as the lecture framed it (tools/imr_frames.json) and writes its four sizes under the lecture photo's own file name;
# tools/r2_sync.sh then uploads them. Their records (data.json course: src, cr, ro, ar, iv) are in the PR, the old
# screenshots out of img/. Runs on a push that changes the frames file, and by hand (Actions > IMR lecture originals to R2).
# Read only: no commit, no repository code beyond the tool and Pillow (from PyPI by hash); the downloaded pictures are
# decoded here only, in a job that holds the R2 secrets and nothing else (host fixed in the tool: www.coralsoftheworld.org).
name: IMR lecture originals to R2
on:
  push:
    branches: [main]
    # The frames file only: a change of the tool alone does not rebuild the 86 photos (since REE-60 the tool writes the framing in
    # force, Pierre's crop over the lecture's, and tools/fetch_approved.py remakes a photo when it changes).
    paths: [tools/imr_frames.json]
  workflow_dispatch:
permissions:
  contents: read
# One writer of a lecture photo's files at a time with approved-photos.yml, which remakes one when Pierre crops it (REE-60): a
# run here that began before his Publish must not upload the lecture's framing over the new crop after that run did. The
# run reads main when it starts, so its curation.json is the latest one. This one group only, never photos-r2 as well: with
# both, this run (holding photos-r2) waited for candidate-photos while an approved-photos run (holding candidate-photos)
# waited in its r2 job for photos-r2, a deadlock (Codex review of #1400). The files here are never in img/ (the 86 traced
# photos are off it, tests/imrsources.test.js), so photos-r2.yml's and the r2 job's copy of img/ cannot touch them, and
# this upload, like the one of new photos in approved-photos.yml, only adds files. (GitHub keeps one waiting run per group:
# a run waiting behind another is replaced by a newer one, whichever workflow it is; start this one by hand again if it
# was, and an approved-photos run replaced here is made up by the next one, which reads main whole: the weekly run too.)
concurrency:
  group: candidate-photos
  cancel-in-progress: false
jobs:
  originals:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install --require-hashes -r tools/requirements.txt
      - run: python tools/fetch_imr_originals.py --out r2-upload
      - run: tools/r2_sync.sh r2-upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
