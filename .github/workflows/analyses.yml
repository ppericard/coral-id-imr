# The admin's Analyses report (Pierre, 2026-11-04: multifactor analyses of the answer log "every 1000 new answers",
# computed once and stored in the sync sheet, the admin's primary source; its "Recompute here" runs the same code in that
# tab on any device, phones included, and its result stays in that tab: Pierre, 2026-11-05; docs/ARCHITECTURE.md
# "Analyses"). Every hour it asks the
# sheet how many answers the analysed subject has (the corals'; a cheap call, each subject counted apart from sheet v103:
# Pierre, 2026-11-08) and computes only when they reach a round thousand (1000, 2000,
# 3000, …: the milestones, never shifted by the first report's count; Pierre, 2026-11-05) the stored report does not hold
# yet, or when the analysis code changed, or by hand (Run workflow, "force"). Needs the repository secret
# ANALYSES_ADMIN_TOKEN (Pierre's one-time setup: docs/HANDOVER.md "Analyses report"); without it every run is skipped.
# Privacy: the report holds per-player results; it goes to the sheet only. The script prints counts only, never an id
# or a name (the log of a public repository's Actions is public). No artifact, no cache, no upload.
name: Analyses report
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Compute now, even before the log reaches the next round thousand'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: analyses
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Secret present?
        id: secret
        env:
          TOKEN: ${{ secrets.ANALYSES_ADMIN_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ANALYSES_ADMIN_TOKEN is not set: skipped (docs/HANDOVER.md, \"Analyses report\")."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secret.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.secret.outputs.ok == 'true'
        with:
          node-version: '26'
          # No cache (privacy note above). setup-node v5+ caches by itself only for a package.json naming npm, which this
          # repo never has; said explicitly so it stays off.
          package-manager-cache: false
      - name: Compute and store the report (counts only in this log)
        if: steps.secret.outputs.ok == 'true'
        env:
          ANALYSES_ADMIN_TOKEN: ${{ secrets.ANALYSES_ADMIN_TOKEN }}
        run: node tools/analyses.js --sheet ${{ inputs.force && '--force' || '' }}
