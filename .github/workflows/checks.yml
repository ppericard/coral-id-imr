# Fast checks on every pull request (code review 2026-11-01, M6/M7): JS syntax, unit tests (tests/docs.test.js among
# them), JSON files (and the data.json layout, M5), Python tools, cache-busting versions and the sheet script's VERSION.
# Node and Python only: the Playwright smoke tests are their own workflow, .github/workflows/smokes.yml, which a docs-only
# PR skips (Pierre, 2026-11-08, Q305 d). Both also run on a merge train's push (train/*, tools/train.py; Q305 b).
name: Checks
on:
  pull_request:
  push:
    branches: ['train/*']
  workflow_dispatch:
permissions:
  contents: read
# A new push to the same PR cancels the run still going on the older commit (test-suite review, 2026-11-04: 2.9 pushes per
# branch, each run waited behind the stale one).
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # The image named in every workflow, not ubuntu-latest, so the next Ubuntu is a reviewed one-line PR (rule W9).
    runs-on: ubuntu-26.04
    steps:
      # Depth 2, not the whole history (with every photo it cost ~300 s of checkout): on a PR the commit checked out is
      # GitHub's merge of the PR into main, so HEAD^1 is main, the base the sheet's VERSION is checked against (rule D3).
      # The other version numbers are stamped at deploy (tools/stamp_versions.py, Pierre 2026-11-04), never bumped in a PR.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      # The checks and tests run python3: pinned, not the image's own (3.14 on Ubuntu 26.04, 3.12 on 24.04); the latest
      # stable (rule W9), the same in every workflow.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Formatting (Prettier 3.9.10; .prettierrc.json, .prettierignore)
        run: |
          npx --yes prettier@3.9.10 --check "*.js" "*.css" "proto/*.js" "proto/*.css" "tests/*.js"
      - name: JS syntax
        run: |
          for f in *.js proto/*.js tests/*.js tools/*.js tools/og/*.js; do node --check "$f" || exit 1; done
      # Pillow (tools/requirements.txt, by hash): tests/fishgame.test.js runs the fish photo download on a fixture.
      - name: Python packages
        run: pip install --require-hashes -r tools/requirements.txt
      - name: Unit tests
        run: |
          node --test tests/*.test.js
      # Every JSON file git tracks: the root's, tools/ and judging/ (tools/check_json.py; Deploy Pages runs it too).
      - name: JSON files parse
        run: |
          python3 tools/check_json.py
      - name: data.json layout (one genus per line, written by tools/datajson.py)
        run: |
          python3 tools/datajson.py --check
      - name: Python tools compile
        run: |
          python3 -m py_compile tools/*.py
      - name: Photo sizes (every photo in 1600, 960, 480 and 240 px, tools/photos.py)
        run: |
          python3 tools/photos.py --check
      - name: core.js embedded in the sync script (tools/sync_core.py; the sheet replays progress with the app's engine)
        run: |
          python3 tools/sync_core.py --check
      - name: The rename to IMR Reef ID is complete (tools/rename_app.py; an old name kept on purpose carries rename-app keep)
        run: |
          python3 tools/rename_app.py --check
      # The sheet's VERSION is assigned at merge (Q305 a, tools/sheet_version.py): a PR against its base (HEAD^1, above),
      # a train or main as about to go live (no changes file left), any other branch for consistency only.
      - name: Cache-busting versions consistent (stamped at deploy; tests/versions.test.js stamps a copy as the deploy does), sheet VERSION
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 tools/check_versions.py --sheet-base HEAD^1
          elif [ "$REF" = refs/heads/main ] || [[ "$REF" == refs/heads/train/* ]]; then
            python3 tools/check_versions.py --main
          else
            python3 tools/check_versions.py
          fi
      - name: Stack pins consistent with tools/stack.json (tools/stack_check.py; --latest, run by hand or by the brief, says what is behind)
        run: |
          python3 tools/stack_check.py --check
