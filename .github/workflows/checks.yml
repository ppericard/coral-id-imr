# Fast checks on every pull request: formatting, JS syntax, JSON files (and the data.json layout), Python tools,
# cache-busting versions and the sheet script's VERSION in the checks job; the unit tests (tests/docs.test.js among them)
# in the unit job, two shards on two runners side by side. Node and Python only: the Playwright smoke tests are their own
# workflow, .github/workflows/smokes.yml, which a docs-only PR skips. Both also run on a merge train's push (train/*,
# tools/train.py), which waits for this workflow by its name, Checks.
name: Checks
on:
  pull_request:
  push:
    branches: ['train/*']
  workflow_dispatch:
  # Main after each Candidate photos run (REE-281): the two kinds of commits that reach main without a train, Pierre's
  # Publish (which starts that workflow) and the bot's refill (pushed with GITHUB_TOKEN, which starts no push workflow),
  # are tested here, on main as it stands when the run ends (a workflow_run checks out the default branch's last commit;
  # each job's "Tested commit" names it). A train's merge is not run again: main's tree is the train's, tested (rule W26).
  # Read-only like every run of this file (no secret, contents: read); the train waits for push runs only, so this run
  # is never taken for a train's.
  workflow_run:
    workflows: [Candidate photos]
    types: [completed]
    branches: [main]
permissions:
  contents: read
# A new push to the same PR cancels the run still going on the older commit (test-suite review, 2026-11-04: 2.9 pushes per
# branch, each run waited behind the stale one).
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# A one-PR train whose tree is the one its PR run tested reuses this workflow's result (Pierre, 2026-11-26, REE-121 (a);
# tools/train_reuse.py proves it job by job): tools/train.py then names the branch train/<time>-reuse-checks, and each
# job's `if:` below skips it there only. Every job records the commit it checked out ("Tested commit", an annotation the
# train reads back). Rollback: TRAIN_REUSE=off (tools/train_reuse.py), and no train branch carries the suffix.
jobs:
  checks:
    if: ${{ !(startsWith(github.ref, 'refs/heads/train/') && contains(github.ref, '-reuse-checks')) }}
    # The image named in every workflow, not ubuntu-latest, so the next Ubuntu is a reviewed one-line PR (rule W9).
    runs-on: ubuntu-26.04
    steps:
      # Depth 2, not the whole history (with every photo it cost ~300 s of checkout): on a PR the commit checked out is
      # GitHub's merge of the PR into main, so HEAD^1 is main, the base the sheet's VERSION is checked against (rule D3).
      # The other version numbers are stamped at deploy (tools/stamp_versions.py, Pierre 2026-11-04), never bumped in a PR.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Tested commit
        run: echo "::notice title=tested commit::commit=$(git rev-parse HEAD) tree=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      # The checks and tests run python3: pinned, not the image's own (3.14 on Ubuntu 26.04, 3.12 on 24.04); the latest
      # stable (rule W9), the same in every workflow.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Formatting (Prettier 3.10.1; .prettierrc.json, .prettierignore)
        run: |
          npx --yes prettier@3.10.1 --check "*.js" "*.css" "proto/*.js" "proto/*.css" "tests/*.js"
      - name: JS syntax
        run: |
          for f in *.js proto/*.js tests/*.js tools/*.js tools/og/*.js; do node --check "$f" || exit 1; done
      # Every JSON file git tracks: the root's, tools/ and judging/ (tools/check_json.py; Deploy Pages runs it too).
      - name: JSON files parse
        run: |
          python3 tools/check_json.py
      - name: data.json layout (one genus per line, written by tools/datajson.py)
        run: |
          python3 tools/datajson.py --check
      - name: Python tools compile
        run: |
          python3 -m py_compile tools/*.py
      - name: Photo sizes (every photo in 1600, 960, 480 and 240 px, tools/photos.py)
        run: |
          python3 tools/photos.py --check
      - name: core.js embedded in the sync script (tools/sync_core.py; the sheet replays progress with the app's engine)
        run: |
          python3 tools/sync_core.py --check
      - name: The rename to IMR Reef ID is complete (tools/rename_app.py; an old name kept on purpose carries rename-app keep)
        run: |
          python3 tools/rename_app.py --check
      # The sheet's VERSION is assigned at merge (Q305 a, tools/sheet_version.py): a PR against its base (HEAD^1, above),
      # a train or main as about to go live (no changes file left), any other branch for consistency only.
      - name: Cache-busting versions consistent (stamped at deploy; tests/versions.test.js stamps a copy as the deploy does), sheet VERSION
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 tools/check_versions.py --sheet-base HEAD^1
          elif [ "$REF" = refs/heads/main ] || [[ "$REF" == refs/heads/train/* ]]; then
            python3 tools/check_versions.py --main
          else
            python3 tools/check_versions.py
          fi
      - name: Stack pins consistent with tools/stack.json (tools/stack_check.py; --latest, run by hand or by the brief, says what is behind)
        run: |
          python3 tools/stack_check.py --check
  # The unit tests, every tests/*.test.js, in shards on runners of their own: node --test sorts the files and deals them
  # out in turn (--test-shard=k/n), so the shards cover every file between them, and each runner runs its files a few at
  # once. tests/smokeparts.test.js fails when the shard list and n disagree.
  unit:
    name: unit tests (${{ matrix.shard }}/2)
    if: ${{ !(startsWith(github.ref, 'refs/heads/train/') && contains(github.ref, '-reuse-checks')) }}
    runs-on: ubuntu-26.04
    strategy:
      # Every shard reports: one failing shard never hides the other.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # The checks job's setup: some tests run git and the Python tools on this checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Tested commit
        run: echo "::notice title=tested commit::commit=$(git rev-parse HEAD) tree=$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      # Pillow and numpy (tools/requirements.txt, by hash): tests/fishgame.test.js runs the fish photo download on a
      # fixture, tests/photomeasure.test.js the photo measures.
      - name: Python packages
        run: pip install --require-hashes -r tools/requirements.txt
      - name: Unit tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          node --test --test-shard="$SHARD/2" tests/*.test.js
