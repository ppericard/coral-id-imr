# Fast checks on every pull request (code review 2026-11-01, M6/M7): JS syntax, unit tests, JSON files,
# Python tools, cache-busting versions. No npm: Node and Python only.
name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax
        run: |
          for f in *.js proto/*.js tests/*.js; do node --check "$f" || exit 1; done
      - name: Unit tests
        run: |
          node --test tests/*.test.js
      - name: JSON files parse
        run: |
          for f in *.json; do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || { echo "Bad JSON: $f"; exit 1; }; done
      - name: Python tools compile
        run: |
          python3 -m py_compile tools/*.py
      - name: Cache-busting versions
        run: |
          python3 tools/check_versions.py ${{ github.base_ref && format('--base origin/{0}', github.base_ref) || '' }}
