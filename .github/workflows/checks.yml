# Fast checks on every pull request (code review 2026-11-01, M6/M7): JS syntax, unit tests, JSON files (and the
# data.json layout, M5), Python tools, cache-busting versions. Node and Python only, except the page smoke test (job "pages"), which
# installs Playwright with npm into a temporary folder (Pierre's OK, 2026-11-01); the repo keeps no package.json.
name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Formatting (Prettier 3.6.2; .prettierrc.json, .prettierignore)
        run: |
          npx --yes prettier@3.6.2 --check "*.js" "*.css" "proto/*.js" "proto/*.css" "tests/*.js"
      - name: JS syntax
        run: |
          for f in *.js proto/*.js tests/*.js; do node --check "$f" || exit 1; done
      - name: Unit tests
        run: |
          node --test tests/*.test.js
      - name: JSON files parse
        run: |
          for f in *.json; do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || { echo "Bad JSON: $f"; exit 1; }; done
      - name: data.json layout (one genus per line, written by tools/datajson.py)
        run: |
          python3 tools/datajson.py --check
      - name: Python tools compile
        run: |
          python3 -m py_compile tools/*.py
      - name: Cache-busting versions
        run: |
          python3 tools/check_versions.py ${{ github.base_ref && format('--base origin/{0}', github.base_ref) || '' }}
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright (temporary folder, nothing added to the repo)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Page smoke test (main routes and admin, 390 and 1280 px, fails on any page error)
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/pages.smoke.js
      - name: Question draw test (photoSet and distractors on the real data, every genus, 4 player levels)
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/draw.smoke.js
