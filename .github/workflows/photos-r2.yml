# Copy img/ to Cloudflare R2 and check the bucket holds every photo that lives on R2 only (tools/r2_sync.sh; it never
# deletes from the bucket): on a push that changes img/, and by hand (Actions > Photos to R2 > Run workflow). The
# candidate-photos workflow runs the same script after its own commits.
name: Photos to R2
on:
  push:
    branches: [main]
    paths: ['img/**']
  workflow_dispatch:
permissions:
  contents: read
# Shared with the r2 job of approved-photos.yml: one writer of the bucket at a time (Codex review #380).
concurrency:
  group: photos-r2
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-26.04
    steps:
      # Always today's main, not the commit that started the run: a rerun of an older run would copy an older crop of a
      # photo back over a newer one, and check the bucket against an older list (Codex review #380). As pages.yml does.
      - uses: actions/checkout@v7
        with:
          ref: main
      # r2_sync.sh runs python3 tools/photos.py --r2-list: Python pinned as in every workflow (approved-photos.yml).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: tools/r2_sync.sh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
