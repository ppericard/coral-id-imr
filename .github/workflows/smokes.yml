# The Playwright smoke tests, one job per smoke file, in parallel on separate runners (pages, fish and admin in
# groups), installing Playwright with npm into a temporary folder; the repo keeps no package.json. Where the browser
# matrix runs (rule W12; Pierre, 2026-11-26, REE-121 (b) and (d)):
# - a pull request: never on its head (d); the "browser scope" job's `if:` below keeps it off, and the agent runs the
#   one smoke part its change touches locally (rule W14). A PR that changes only docs skips this whole workflow
#   (paths-ignore below, GitHub's rules: every changed file must match; `*` stops at `/`); the Checks workflow,
#   tests/docs.test.js included, still runs on it. Keep that list narrow: never tools/, tests/, judging/ or a data file
#   (the smokes read them); tools/smoke_scope.py DOCS is the same list (tests/smokeparts.test.js).
# - a merge train's push (train/*, tools/train.py): all of it on a code, mixed or unknown train, none on a docs-only one
#   (b): tools/smoke_scope.py classifies the whole diff from the train's base, and tools/train.py refuses a train
#   whose expected jobs did not all run.
# - workflow_dispatch: all of it, on any branch (the manual full validation).
# One more job, "answer cost" (last in this file), runs beside them on every run of this workflow (code PRs and every
# train, docs-only trains included): the work of one answer on every subject against its budget.
name: Smokes
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/pull_request_template.md'
      - 'LICENSE'
  push:
    branches: ['train/*']
  workflow_dispatch:
permissions:
  contents: read
# A new push to the same PR cancels the run still going on the older commit.
concurrency:
  group: smokes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Whether this run needs the browser matrix (tools/smoke_scope.py): browser=false only for a proven docs-only train.
  scope:
    name: browser scope
    # (d) No browser matrix on a PR head (Pierre, 2026-11-26). ROLLBACK, if the late signal slows delivery too much:
    # delete the one line below; this job then runs on PRs, says browser=true, and every code PR runs the matrix again.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      # The script only, at the run's commit, with its first-parent history (commits and trees, no file contents).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          sparse-checkout: tools/smoke_scope.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      # main as it is now, to prove the train's base is on it; a failed fetch leaves the base unproven: the full matrix.
      - name: Fetch main (commits and trees only)
        run: git fetch -q --no-tags --filter=blob:none --depth=50 origin +refs/heads/main:refs/remotes/origin/main || echo "::warning::main not fetched"
      - name: Docs-only train or not (the whole diff from its base, deletions and both sides of a rename)
        id: scope
        run: python3 tools/smoke_scope.py
  smoke:
    name: smoke (${{ matrix.name }})
    needs: scope
    # Skipped when the scope job is (a PR head) or says false (a docs-only train); a missing answer runs the matrix.
    if: needs.scope.outputs.browser != 'false'
    runs-on: ubuntu-26.04
    strategy:
      # Every smoke reports: one failing smoke never hides the others.
      fail-fast: false
      # The longest smokes run in groups, one runner each, so no job is the long pole (tests/slot.js: SMOKE_PART for
      # pages.smoke.js and fish.smoke.js, whose groups cover every part between them or the run fails, and
      # tests/smokeparts.test.js, which reads this file, fails when a group is in no job here; admin.smoke.js runs whole at 390, in three groups at
      # 1280, SMOKE_W one width each). The groups are balanced by the time of each part, which a run prints ("admin.smoke part
      # photos: 122 s"); the matrix's longest job sets the time of every merge train, so measure before moving a part.
      matrix:
        include:
          - name: pages main
            smoke: pages
            part: main
            what: Page smoke test, main routes (the routes at 390 and 1280 px, sheets, history, tips, the new player, one path)
          - name: pages overlays
            smoke: pages
            part: overlays
            what: Page smoke test, overlays (cards, prompts, the one-tap question, the tour)
          - name: pages more
            smoke: pages
            part: more
            what: Page smoke test, more (the Duel tab relief card, the first-launch question, sign-in, the sheet's replay, notices after the sync)
          - name: pages rest
            smoke: pages
            part: rest
            what: Page smoke test, rest (Coral basics, credits, pages opened, the subject tour)
          - name: draw
            smoke: draw
            what: Question draw test (photoSet and distractors on the real data, every genus, 4 player levels)
          - name: fish main
            smoke: fish
            part: main
            what: Fish games, account sync and load-order tests
          - name: fish fresh
            smoke: fish
            part: fresh
            what: Fish quiz, beta access, Memory and five brand-new players
          - name: seaslug
            smoke: seaslug
            what: Sea slug subject test (its beta gate both ways, the admin's quiz, pages and switch on seaslug.json)
          - name: live
            smoke: live
            what: Live mode test (a trainer and three students on the in-memory sheet, the role check, every phase, the logged answers)
          - name: admin 390
            smoke: admin
            w: '390'
            what: Admin demo test at 390 px (admin.html?demo, every page and the main actions on made-up data, nothing sent)
          - name: admin 1280 main
            smoke: admin
            w: '1280'
            part: main
            what: Admin demo test at 1280 px, main (admin.html?demo, every page, Analyses, To do, Activity, Health; made-up data, nothing sent)
          - name: admin 1280 photos
            smoke: admin
            w: '1280'
            part: photos
            what: Admin demo test at 1280 px, photos (Growth form, Candidates, the auto-sort, Publish, the difficulty bands' colours; made-up data, nothing sent)
          - name: admin 1280 rest
            smoke: admin
            w: '1280'
            part: rest
            what: Admin demo test at 1280 px, rest (Analyses' Formats, sort and milestones, views remembered, To do, Hidden, the view filter; Players' actions and journeys; Sign out sealing the draft; made-up data, nothing sent)
          - name: profiles
            smoke: profiles
            what: Learning path test (a beginner, an IMR RA, an expert through the real quiz; docs/LEARNING.md)
          - name: net
            smoke: net
            what: Poor connection test (start-up without curation.json, preloaded next question, photo fallback, kept leaderboard)
          - name: pending
            smoke: pending
            what: Kept question test (every subject, leave to Learn and back, a reload, answered; the Quiz, the Custom quiz, the Duel tab, typed and Find the X)
          - name: staged
            smoke: staged
            what: Built copy test (the site as the deploy builds it, scripts minified; each subject's Home and a question, the Lab, the admin, the worker)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      # The checks and tests run python3: pinned, not the image's own (3.14 on Ubuntu 26.04, 3.12 on 24.04); the latest
      # stable (rule W9), the same in every workflow.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      # The Chromium download (~170 MB) is kept between runs; the key follows the Playwright pin below.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.65.1
      # Chromium only, without --with-deps: on ubuntu-26.04 its apt step installed nine font
      # packages and no library (the image has Chromium's libraries), about 10 s a job. The pages draw their text in
      # their own fonts (fonts/, app.css @font-face). If Chromium one day fails to start for a missing library, put
      # --with-deps back.
      # terser too (about a second): the staged smoke builds the site as the deploy does (tools/build_site.py, tools/minify.js).
      - name: Install Playwright and terser (temporary folder, nothing added to the repo)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm install --no-save --no-audit --no-fund playwright@1.65.1 terser@5.51.4
          npx playwright install chromium
      - name: ${{ matrix.what }}
        env:
          SMOKE_PART: ${{ matrix.part }}
          SMOKE_W: ${{ matrix.w }}
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/${{ matrix.smoke }}.smoke.js
  # The work of one answer, on every subject at three histories (REE-265 step 0, REE-274; docs/spec/tools.md "Per-answer
  # cost"): fish, corals and sea slugs at 50, 500 and 3,000 answers, each in the middle of a session and back after a break
  # (a comeback), counted by tools/answercost.js on saved players and held to tools/answercost-budget.json. A count over its ceiling fails this job and names the count (an OVER BUDGET line and an
  # error annotation). Its own job, side by side with the smokes and needing none of them, nor the scope job (so it runs
  # on every code PR and every train, docs-only trains included, as before REE-121 (b) and (d)): the counts are not part of the
  # agents' local checks (Pierre, 2026-11-24 14:06: a minute or two a check, times the checks, times the agents, climbs
  # fast), and the job must end before the longest smoke does (its time is in the PR that added it; each run's summary
  # holds the table of every state). The saved players are made afresh in the job (three runs of learnsim, one a
  # subject, side by side, then the eighteen counts three at a time: about 4 minutes on a quiet 4-core machine), so each run
  # counts the app as it is, with nothing kept between runs. If that ever outgrows the smokes, keep them in the Actions
  # cache under a key of tools/learnprof.js (docs/spec/tools.md "Per-answer cost"). Playwright as the smokes have it.
  answercost:
    name: answer cost
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.65.1
      - name: Install Playwright (temporary folder, nothing added to the repo)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm install --no-save --no-audit --no-fund playwright@1.65.1
          npx playwright install chromium
      - name: Work of one answer against the budget (fish, corals, sea slugs; 50, 500 and 3,000 answers; in a session and back)
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/answercost.js --budget tools/answercost-budget.json
