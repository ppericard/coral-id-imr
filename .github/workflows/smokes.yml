# The Playwright smoke tests, one job per smoke file, in parallel on separate runners (pages, fish and admin in
# groups), installing Playwright with npm into a temporary folder; the repo keeps no
# package.json. A pull request that changes only docs skips them
# (paths-ignore below: every changed file must match for the run to be skipped); the Checks workflow, tests/docs.test.js
# included, still runs on it. A merge train's push (train/*, tools/train.py) always runs every smoke: it is the
# tree that goes live. Keep the list narrow: never tools/, tests/, judging/ or a data file (the smokes read them).
name: Smokes
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/pull_request_template.md'
      - 'LICENSE'
  push:
    branches: ['train/*']
  workflow_dispatch:
permissions:
  contents: read
# A new push to the same PR cancels the run still going on the older commit.
concurrency:
  group: smokes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: smoke (${{ matrix.name }})
    runs-on: ubuntu-26.04
    strategy:
      # Every smoke reports: one failing smoke never hides the others.
      fail-fast: false
      # The longest smokes run in groups, one runner each, so no job is the long pole (tests/slot.js: SMOKE_PART for
      # pages.smoke.js and fish.smoke.js, whose groups cover every part between them or the run fails, and
      # tests/smokeparts.test.js, which reads this file, fails when a group is in no job here; admin.smoke.js runs whole at 390, in three groups at
      # 1280, SMOKE_W one width each). The groups are balanced by the time of each part, which a run prints ("admin.smoke part
      # photos: 122 s"); the matrix's longest job sets the time of every merge train, so measure before moving a part.
      matrix:
        include:
          - name: pages main
            smoke: pages
            part: main
            what: Page smoke test, main routes (the routes at 390 and 1280 px, sheets, history, tips, the new player, one path)
          - name: pages overlays
            smoke: pages
            part: overlays
            what: Page smoke test, overlays (cards, prompts, the one-tap question, the tour)
          - name: pages more
            smoke: pages
            part: more
            what: Page smoke test, more (the Duel tab relief card, the first-launch question, sign-in, the sheet's replay, notices after the sync)
          - name: pages rest
            smoke: pages
            part: rest
            what: Page smoke test, rest (Coral basics, credits, pages opened, the subject tour)
          - name: draw
            smoke: draw
            what: Question draw test (photoSet and distractors on the real data, every genus, 4 player levels)
          - name: fish main
            smoke: fish
            part: main
            what: Fish quiz test (the fish subject on the real fish.json, circles opt-in, winks, progress kept apart)
          - name: fish fresh
            smoke: fish
            part: fresh
            what: Fish quiz test, the brand-new fish players (the starter core, the easy photos before Open Water, five seeds)
          - name: seaslug
            smoke: seaslug
            what: Sea slug subject test (its beta gate both ways, the admin's quiz, pages and switch on seaslug.json)
          - name: live
            smoke: live
            what: Live mode test (a trainer and three students on the in-memory sheet, the role check, every phase, the logged answers)
          - name: admin 390
            smoke: admin
            w: '390'
            what: Admin demo test at 390 px (admin.html?demo, every page and the main actions on made-up data, nothing sent)
          - name: admin 1280 main
            smoke: admin
            w: '1280'
            part: main
            what: Admin demo test at 1280 px, main (admin.html?demo, every page, Analyses, To do, Activity, Health; made-up data, nothing sent)
          - name: admin 1280 photos
            smoke: admin
            w: '1280'
            part: photos
            what: Admin demo test at 1280 px, photos (Growth form, Candidates, the auto-sort, Publish, the difficulty bands' colours; made-up data, nothing sent)
          - name: admin 1280 rest
            smoke: admin
            w: '1280'
            part: rest
            what: Admin demo test at 1280 px, rest (Analyses' Formats, sort and milestones, views remembered, To do, Hidden, the view filter; Players' actions and journeys; Sign out sealing the draft; made-up data, nothing sent)
          - name: profiles
            smoke: profiles
            what: Learning path test (a beginner, an IMR RA, an expert through the real quiz; docs/LEARNING.md)
          - name: net
            smoke: net
            what: Poor connection test (start-up without curation.json, preloaded next question, photo fallback, kept leaderboard)
          - name: staged
            smoke: staged
            what: Built copy test (the site as the deploy builds it, scripts minified; each subject's Home and a question, the Lab, the admin, the worker)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      # The checks and tests run python3: pinned, not the image's own (3.14 on Ubuntu 26.04, 3.12 on 24.04); the latest
      # stable (rule W9), the same in every workflow.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      # The Chromium download (~170 MB) is kept between runs; the key follows the Playwright pin below.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.65.1
      # Chromium only, without --with-deps: on ubuntu-26.04 its apt step installed nine font
      # packages and no library (the image has Chromium's libraries), about 10 s a job. The pages draw their text in
      # their own fonts (fonts/, app.css @font-face). If Chromium one day fails to start for a missing library, put
      # --with-deps back.
      # terser too (about a second): the staged smoke builds the site as the deploy does (tools/build_site.py, tools/minify.js).
      - name: Install Playwright and terser (temporary folder, nothing added to the repo)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm install --no-save --no-audit --no-fund playwright@1.65.1 terser@5.51.2
          npx playwright install chromium
      - name: ${{ matrix.what }}
        env:
          SMOKE_PART: ${{ matrix.part }}
          SMOKE_W: ${{ matrix.w }}
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/${{ matrix.smoke }}.smoke.js
