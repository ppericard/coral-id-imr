# Keeps the GitHub Actions in .github/workflows/ on their latest major (rule W9, docs/rules/ship.md; Node 20 actions were
# forced onto Node 24 before the bump of 2026-11-05) and the Python packages of tools/requirements.txt (Pillow) on their
# latest stable. Prettier, Playwright, Node, Python, the runner image and the rest stay hand-bumped: their pins live in
# tools/stack.json (python3 tools/stack_check.py --latest says what is behind; no package.json, Pierre's rule). One
# grouped PR a week at most per ecosystem; who merges it: AGENTS.md "Working mode" (Dependabot PRs).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 2
  # tools/requirements.txt (pillow==, with every file's hash: what the CI photo jobs install, pip --require-hashes). A
  # Pillow bump replaces the hashes too, and bumps tools/stack.json's pillow item (the Checks job fails until it does);
  # check that tools/photos.py still writes byte-identical WebP.
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ['*']
    open-pull-requests-limit: 2
